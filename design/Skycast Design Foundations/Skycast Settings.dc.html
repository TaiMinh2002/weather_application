<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0;background:#EDEDED;font-family:'Be Vietnam Pro',sans-serif}.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;display:inline-block;line-height:1}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block"></helmet>
<div style="display:flex;gap:56px;padding:56px;flex-wrap:wrap;align-items:flex-start">
<sc-for list="{{ frames }}" as="f" hint-placeholder-count="3">
<div style="display:flex;flex-direction:column;gap:14px;align-items:center">
<span style="font-size:14px;font-weight:600;color:#334155">{{ f.label }}</span>
<div style="width:{{ f.w }}px;height:{{ f.h }}px;border-radius:44px;overflow:hidden;box-shadow:0 0 0 8px #111;position:relative;background:{{ f.c.surface }};display:flex;flex-direction:column">

<div style="display:flex;align-items:center;gap:4px;padding:8px 8px 0;flex:none">
<span class="ms" style="font-size:24px;color:{{ f.c.onSurface }};width:44px;height:44px;display:flex;align-items:center;justify-content:center">arrow_back</span>
<span style="font-size:22px;line-height:28px;font-weight:600;color:{{ f.c.onSurface }}">{{ f.title }}</span>
</div>

<div style="padding:16px;display:flex;flex-direction:column;gap:24px;overflow-y:auto;flex:1">

<sc-for list="{{ f.groups }}" as="g" hint-placeholder-count="3">
<div style="display:flex;flex-direction:column;gap:10px">
<span style="font-size:12px;line-height:16px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;color:{{ f.c.textMuted }};padding:0 4px">{{ g.title }}</span>
<div style="background:{{ f.c.surfaceContainer }};border-radius:12px;display:flex;flex-direction:column">
<sc-for list="{{ g.rows }}" as="row" hint-placeholder-count="3">
<div style="display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:{{ row.border }};min-height:48px;gap:12px">
<div style="display:flex;align-items:center;gap:6px;flex:none"><sc-if value="{{ row.rowIcon }}" hint-placeholder-val="{{ false }}"><span class="ms" style="font-size:18px;color:{{ f.c.textMuted }}">{{ row.rowIcon }}</span></sc-if><span style="font-size:16px;line-height:24px;color:{{ f.c.onSurface }}">{{ row.label }}</span></div>
<sc-if value="{{ row.seg }}" hint-placeholder-val="{{ false }}">
<div style="display:flex;background:{{ f.c.card }};border-radius:999px;padding:3px;flex:none">
<sc-for list="{{ row.opts }}" as="op" hint-placeholder-count="3">
<div style="padding:6px {{ f.segPad }}px;border-radius:999px;background:{{ op.sel }};color:{{ op.fg }};font-size:{{ f.segFont }}px;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap"><sc-if value="{{ op.icon }}" hint-placeholder-val="{{ false }}"><span class="ms" style="font-size:14px">{{ op.icon }}</span></sc-if>{{ op.label }}</div>
</sc-for>
</div>
</sc-if>
<sc-if value="{{ row.info }}" hint-placeholder-val="{{ false }}"><span style="font-size:16px;line-height:24px;color:{{ f.c.textMuted }}">{{ row.value }}</span></sc-if>
<sc-if value="{{ row.nav }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:4px;color:{{ f.c.textMuted }}"><sc-if value="{{ row.extIcon }}" hint-placeholder-val="{{ false }}"><span class="ms" style="font-size:18px">open_in_new</span></sc-if><span class="ms" style="font-size:20px">chevron_right</span></div></sc-if>
</div>
</sc-for>
</div>
</div>
</sc-for>

</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const LIGHT = { primary:'#2563EB', onPrimary:'#FFFFFF', surface:'#F8FAFC', onSurface:'#0F172A', surfaceContainer:'#FFFFFF', outline:'#E2E8F0', textMuted:'#64748B', card:'#F1F5F9' };
const DARK = { primary:'#60A5FA', onPrimary:'#0B1220', surface:'#0F172A', onSurface:'#F1F5F9', surfaceContainer:'#1E293B', outline:'#334155', textMuted:'#94A3B8', card:'#1E293B' };

function seg(c, options, selIdx) {
  return options.map((o,i) => ({ label:o.label, icon:o.icon, sel: i===selIdx ? c.primary : 'transparent', fg: i===selIdx ? c.onPrimary : c.textMuted }));
}
function withBorders(rows, c) {
  return rows.map((r,i) => ({ ...r, border: i===rows.length-1 ? 'none' : `1px solid ${c.outline}` }));
}

class Component extends DCLogic {
  groups(c, lang, tempSel, windSel, themeSel) {
    const T = lang === 'en'
      ? { units:'UNITS', temp:'Temperature', wind:'Wind speed', appearance:'APPEARANCE', theme:'Theme', lang:'Language', about:'ABOUT', ver:'Version', data:'Weather data', src:'Source code', light:'Light', dark:'Dark', system:'System', vi:'Vietnamese', en:'English' }
      : { units:'ĐƠN VỊ', temp:'Nhiệt độ', wind:'Tốc độ gió', appearance:'GIAO DIỆN', theme:'Chủ đề', lang:'Ngôn ngữ', about:'GIỚI THIỆU', ver:'Phiên bản', data:'Dữ liệu thời tiết', src:'Mã nguồn', light:'Sáng', dark:'Tối', system:'Hệ thống', vi:'Tiếng Việt', en:'English' };
    return [
      { title:T.units, rows: withBorders([
        { seg:true, label:T.temp, opts: seg(c, [{label:'°C'},{label:'°F'}], tempSel) },
        { seg:true, label:T.wind, opts: seg(c, [{label:'km/h'},{label:'m/s'}], windSel) },
      ], c)},
      { title:T.appearance, rows: withBorders([
        { seg:true, label:T.theme, opts: seg(c, [{label:T.light,icon:'light_mode'},{label:T.dark,icon:'dark_mode'},{label:T.system,icon:'routine'}], themeSel) },
        { seg:true, label:T.lang, opts: seg(c, [{label:T.vi},{label:T.en}], lang==='en'?1:0) },
      ], c)},
      { title:T.about, rows: withBorders([
        { info:true, label:T.ver, value:'1.0.0' },
        { nav:true, rowIcon:'cloud', label:T.data, extIcon:true },
        { nav:true, rowIcon:'code', label:T.src },
      ], c)},
    ];
  }
  renderVals() {
    const frames = [
      { label:'1 · Light — Hệ thống, Tiếng Việt', w:390, h:844, c:LIGHT, title:'Cài đặt', segPad:14, segFont:13, groups: this.groups(LIGHT,'vi',0,0,2) },
      { label:'2 · Dark — Tối, °F/m/s, English', w:390, h:844, c:DARK, title:'Settings', segPad:14, segFont:13, groups: this.groups(DARK,'en',1,1,1) },
      { label:'3 · iPhone SE 375×667', w:375, h:667, c:LIGHT, title:'Cài đặt', segPad:9, segFont:11, groups: this.groups(LIGHT,'vi',0,0,2) },
    ];
    return { frames };
  }
}
</script>
</body>
</html>
