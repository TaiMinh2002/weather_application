<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>body{margin:0;background:#EDEDED;font-family:'Be Vietnam Pro',sans-serif}.frame{width:390px;height:844px;border-radius:44px;overflow:hidden;box-shadow:0 0 0 8px #111;position:relative}</style>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600&amp;display=block"></helmet>
<div style="display:flex;gap:56px;padding:56px;flex-wrap:wrap;align-items:flex-start">
<sc-for list="{{ frames }}" as="f" hint-placeholder-count="4">
<div style="display:flex;flex-direction:column;gap:14px;align-items:center">
<span style="font-size:14px;font-weight:600;color:#334155">{{ f.label }}</span>
<div class="frame" style="background:{{ f.bg }}">
<div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:288px;height:288px;{{ f.clip }}">
<div style="width:1024px;height:1024px;position:relative;transform:scale({{ f.scale }});transform-origin:center center">
<div style="position:absolute;left:620px;top:420px;width:0;height:0">
<div style="position:absolute;left:-13px;top:-220px;width:26px;height:70px;border-radius:13px;background:{{ f.iconColor }};transform:rotate(0deg);transform-origin:13px 220px"></div>
<div style="position:absolute;left:-13px;top:-220px;width:26px;height:70px;border-radius:13px;background:{{ f.iconColor }};transform:rotate(45deg);transform-origin:13px 220px"></div>
<div style="position:absolute;left:-13px;top:-220px;width:26px;height:70px;border-radius:13px;background:{{ f.iconColor }};transform:rotate(90deg);transform-origin:13px 220px"></div>
<div style="position:absolute;left:-13px;top:-220px;width:26px;height:70px;border-radius:13px;background:{{ f.iconColor }};transform:rotate(135deg);transform-origin:13px 220px"></div>
<div style="position:absolute;left:-13px;top:-220px;width:26px;height:70px;border-radius:13px;background:{{ f.iconColor }};transform:rotate(180deg);transform-origin:13px 220px"></div>
<div style="position:absolute;left:-13px;top:-220px;width:26px;height:70px;border-radius:13px;background:{{ f.iconColor }};transform:rotate(225deg);transform-origin:13px 220px"></div>
<div style="position:absolute;left:-13px;top:-220px;width:26px;height:70px;border-radius:13px;background:{{ f.iconColor }};transform:rotate(270deg);transform-origin:13px 220px"></div>
<div style="position:absolute;left:-13px;top:-220px;width:26px;height:70px;border-radius:13px;background:{{ f.iconColor }};transform:rotate(315deg);transform-origin:13px 220px"></div>
<div style="position:absolute;left:-150px;top:-150px;width:300px;height:300px;border-radius:50%;background:{{ f.iconColor }}"></div>
</div>
<div style="position:absolute;left:300px;top:520px;width:350px;height:220px;background:{{ f.iconColor }};border-radius:110px"></div>
<div style="position:absolute;left:210px;top:560px;width:240px;height:170px;background:{{ f.iconColor }};border-radius:85px"></div>
<div style="position:absolute;left:460px;top:560px;width:260px;height:170px;background:{{ f.iconColor }};border-radius:85px"></div>
<div style="position:absolute;left:300px;top:660px;width:350px;height:80px;background:{{ f.iconColor }};border-radius:40px"></div>
</div>
</div>
</div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const frames = [
      { label:'iOS · Light', bg:'#F8FAFC', iconColor:'#2563EB', scale:0.1875, clip:'' },
      { label:'iOS · Dark', bg:'#0F172A', iconColor:'#60A5FA', scale:0.1875, clip:'' },
      { label:'Android 12 · Light', bg:'#F8FAFC', iconColor:'#2563EB', scale:0.164, clip:'clip-path:circle(96px at 144px 144px)' },
      { label:'Android 12 · Dark', bg:'#0F172A', iconColor:'#60A5FA', scale:0.164, clip:'clip-path:circle(96px at 144px 144px)' },
    ];
    return { frames };
  }
}
</script>
</body>
</html>
