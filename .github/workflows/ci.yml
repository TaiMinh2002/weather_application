name: CI

on:
  push:
    branches: [dev, main]
    # Pushing a tag like v1.0.0 also publishes a GitHub Release with the APK.
    tags: ['v*']
  pull_request:
    branches: [dev, main]

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the Release on tag pushes
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # Keep in step with the local toolchain (pubspec needs Dart ^3.13.4).
          flutter-version: 3.47.5
          channel: stable
          cache: true

      - run: flutter pub get

      # Generated files are gitignored (see CLAUDE.md).
      - run: flutter gen-l10n
      - run: dart run build_runner build --delete-conflicting-outputs

      - run: flutter analyze
      - run: flutter test

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: skycast-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
